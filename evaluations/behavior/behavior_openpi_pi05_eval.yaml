defaults:
  - cluster/behavior
  - env/behavior_r1pro@env.eval
  - model/pi0_5@rollout.model
  - override hydra/job_logging: stdout
  - _self_

hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
    - file://${oc.env:EMBODIED_PATH}/config/

cluster:
  num_nodes: 1
  component_placement:
    rollout: 1
    env:
      placement: 0

runner:
  task_type: embodied_eval
  logger:
    log_path: "../results"
    project_name: rlinf
    experiment_name: "behavior_openpi_pi05_eval"
    logger_backends: ["tensorboard"]

  only_eval: True

  max_epochs: 1000
  max_steps: 1

  val_check_interval: -1
  save_interval: -1

  resume_dir: null
  ckpt_path: null

env:
  group_name: "EnvGroup"

  eval:
    rollout_epoch: 4
    total_num_envs: 4
    max_episode_steps: 4096
    max_steps_per_rollout_epoch: 4096
    omni_config:
      task:
        instance_split: public_test
        activity_instance_id: 301
    video_cfg:
      save_video: True
      video_base_dir: ${runner.logger.log_path}/video/eval
      fps: 15

rollout:
  group_name: "RolloutGroup"
  backend: "huggingface"
  enable_offload: True
  pipeline_stage_num: 1

  sampling_params:
    do_sample: True
    temperature_train: 1.0
    temperature_eval: 0.6
    top_k: 50
    top_p: 1.0
    repetition_penalty: 1.0
    max_new_tokens: null

  model:
    model_path: /path/to/RLinf-Pi05-BEHAVIOR-1K-PT50-CS32
    precision: bf16
    add_value_head: False
    action_dim: 23
    num_action_chunks: 32
    num_steps: 5
    openpi:
      task: eval
      config_name: "pi05_behavior"
      num_images_in_input: 3
      torch_compile: False
