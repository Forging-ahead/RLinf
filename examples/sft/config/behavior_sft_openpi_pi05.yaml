defaults:
  - model/pi0_5@actor.model
  - hybrid_engines/openpi_fsdp@actor.fsdp_config
  - override hydra/job_logging: stdout

hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
    - file://${oc.env:EMBODIED_PATH}/config/

cluster:
  num_nodes: 1
  component_placement:
    actor,env,rollout: all

runner:
  task_type: sft
  logger:
    log_path: "../results"
    project_name: rlinf
    experiment_name: "behavior_pi05_openpi_sft"
    logger_backends: ["tensorboard"]

  max_epochs: 20
  max_steps: 30000
  val_check_interval: -1
  save_interval: 1000

data:
  # Set both paths to the local 2026 challenge dataset, including meta/, data/, and videos/.
  train_data_paths: /path/to/2026-challenge-demos
  behavior_dataset_root: /path/to/2026-challenge-demos
  repo_id: "behavior-1k/2026-challenge-demos"
  num_workers: 8
  tolerance_s: 1.0e-4
  tasks: ["turning_on_radio"]

algorithm:
  adv_type: gae

actor:
  group_name: "ActorGroup"
  training_backend: "fsdp"
  micro_batch_size: 32
  eval_batch_size: 1
  global_batch_size: 256
  seed: 42

  # actor.model comes from `defaults: model/pi0_5@actor.model` (the
  # path-free shape template). The experiment config supplies the filesystem
  # paths so the model template stays reusable.
  model:
    precision: fp32
    # Download JAX base: gs://openpi-assets/checkpoints/pi05_base
    # Convert with jax_to_openpi; model_path must point to the local output
    # directory containing RLinf OpenPI model.safetensors.
    # Download/conversion steps: docs/source-en/rst_source/examples/embodied/sft_openpi.rst
    model_path: /path/to/pi05_base_openpi
    openpi:
      embed_dtype: bf16
      task: sft
    openpi_data:
      # Supply OpenPI state/action statistics for your 2026 training data and policy layout.
      norm_stats_path: /path/to/norm_stats.json

  optim:
    lr: 2.5e-5
    adam_beta1: 0.9
    adam_beta2: 0.95
    adam_eps: 1.0e-08
    weight_decay: 1e-10
    clip_grad: 1.0
    total_training_steps: 30000
    lr_warmup_steps: 1000
    lr_scheduler: "openpi_cosine"
    num_cycles: 0.5
    min_lr: 0.0

  fsdp_config:
    strategy: "fsdp"
    sharding_strategy: "no_shard"
    use_orig_params: True
    gradient_checkpointing: True
    gradient_checkpointing_use_reentrant: False
    mixed_precision:
      param_dtype: bf16
      reduce_dtype: fp32
      buffer_dtype: fp32

reward:
  use_reward_model: False

critic:
  use_critic_model: False
