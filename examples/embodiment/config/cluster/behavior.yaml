# The simulation worker and the model worker use separate Python environments.
component_placement:
  env:
    node_group: behavior
node_groups:
  - label: behavior
    node_ranks: all
    env_configs:
      - node_ranks: all
        python_interpreter_path: ${oc.env:BEHAVIOR_ENV_PYTHON}
        env_vars:
          - PYTHONPATH: ${oc.env:REPO_PATH}
